[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-client"
version = "0.0.1"
description = "Control surface to start, steer, and observe the dev lab."
requires-python = ">=3.11"
dependencies = [
    # TODO(M3): add the control-surface transport client once chosen
    # (WebSocket / HTTP+SSE / MCP) — see open questions in project-plan.md.
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chat-client = "chat_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
