[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-build-test"
version = "0.1.0"
description = "Platform client: an MCP server exposing build/test capabilities on macOS."
requires-python = ">=3.11"
# Also requires the sibling `platform-client` scaffold; relative-path deps
# aren't expressible here, so `make setup` installs it: pip install -e ../platform-client
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
macos-build-test = "macos_build_test.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
