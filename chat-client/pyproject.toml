[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-client"
version = "0.2.0"
description = "Control surface to start, steer, and observe the dev lab."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chat-client = "chat_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
