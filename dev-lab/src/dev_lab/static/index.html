<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>the lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="loading">
  <!-- LOGIN -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand">◢◤ THE&nbsp;LAB</div>
      <p class="tagline">autonomous agent control room</p>
      <form id="auth-form" autocomplete="on">
        <input id="username" name="username" autocomplete="username" placeholder="username" required />
        <input id="password" name="password" type="password" autocomplete="current-password"
          placeholder="password" required />
        <input id="invite" name="invite" autocomplete="off"
          placeholder="invite code" hidden />
        <div id="auth-error" class="error"></div>
        <div class="auth-actions">
          <button type="submit">log in</button>
          <button type="button" id="register-btn" class="ghost">register</button>
        </div>
      </form>
    </div>
  </main>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand-sm">◢◤ LAB</span>
        <button id="who" class="who" type="button"></button>
      </div>
      <button id="new-project-btn" class="new-project">+ new project</button>
      <form id="new-project-form" class="new-project-form" hidden>
        <input id="np-url" placeholder="git url (https://…)" required />
        <input id="np-token" type="password" autocomplete="off"
          placeholder="github token (private repos &amp; pushing)" />
        <div class="np-actions">
          <button type="submit" id="np-submit">clone</button>
          <button type="button" id="np-cancel" class="ghost">cancel</button>
        </div>
        <div id="np-error" class="error"></div>
      </form>
      <ul id="project-list" class="project-list"></ul>
      <button id="logout-btn" class="logout ghost">log out</button>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="head-left">
          <span id="active-name" class="active-name">—</span>
          <span id="active-branch" class="branch-chip"></span>
        </div>
        <nav id="head-tabs" class="head-tabs" role="tablist" aria-label="project view" hidden>
          <button id="tab-chat" class="tab is-active" type="button" role="tab"
            data-tab="chat" aria-controls="panel-chat" aria-selected="true">chat</button>
          <button id="tab-repo" class="tab" type="button" role="tab"
            data-tab="repo" aria-controls="panel-repo" aria-selected="false">repo</button>
        </nav>
        <div class="head-right">
          <button id="clear-chat-btn" class="clear-chat-btn ghost" type="button" hidden
            title="Clear this chat's history and start a fresh agent context. Your code and branch are not affected.">clear chat</button>
          <span id="active-status" class="status"></span>
        </div>
      </header>

      <section id="panel-chat" class="tab-panel chat-panel" role="tabpanel" aria-labelledby="tab-chat">
        <div id="transcript" class="transcript">
          <div class="empty" id="empty-state">select or clone a project to start talking</div>
        </div>
        <form id="chat-form" class="chat-input" hidden>
          <textarea id="chat-text" rows="1" placeholder="message the agent —  ⏎ to send, ⇧⏎ for newline"></textarea>
          <button type="submit" aria-label="send">↦</button>
        </form>
      </section>

      <section id="panel-repo" class="tab-panel repo-panel" role="tabpanel" aria-labelledby="tab-repo" hidden>
        <div class="repo-card">
          <label id="base-picker" class="base-picker" hidden
            title="Base branch for NEW chat threads. The current chat keeps its own branch.">
            <span class="base-label">new-chat base</span>
            <select id="base-select" class="base-select"
              aria-label="base branch for new chat threads"></select>
          </label>
          <div class="repo-actions">
            <button id="browse-btn" class="merge-btn ghost" hidden>browse files</button>
            <button id="fetch-btn" class="merge-btn ghost" hidden>fetch</button>
            <button id="pull-btn" class="merge-btn ghost" hidden>pull</button>
            <button id="push-btn" class="merge-btn ghost" hidden>push</button>
            <div class="repo-actions-break" aria-hidden="true"></div>
            <button id="merge-base-btn" class="merge-btn ghost" hidden>merge base → branch</button>
            <button id="merge-btn" class="merge-btn ghost" hidden>merge branch → base</button>
          </div>
          <form id="token-form" class="token-form" hidden
            title="This project's GitHub token, used to clone, pull and push. Stored per project.">
            <span id="token-status" class="token-status"></span>
            <input id="token-input" type="password" autocomplete="off"
              placeholder="github token" aria-label="github token" />
            <button id="token-save" type="submit" class="merge-btn ghost">save</button>
            <button id="token-clear" type="button" class="merge-btn ghost">clear</button>
            <span id="token-error" class="error"></span>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ADMIN (super-user only) -->
  <div id="admin-overlay" class="overlay" hidden>
    <div class="admin-panel">
      <header class="admin-head">
        <span class="admin-title">⚙ user administration</span>
        <button id="admin-close" class="ghost" aria-label="close">✕</button>
      </header>

      <section class="admin-section">
        <div class="admin-section-head">
          <h3>invite codes</h3>
          <button id="new-invite-btn">+ new invite</button>
        </div>
        <ul id="invite-list" class="invite-list"></ul>
      </section>

      <section class="admin-section">
        <h3>users</h3>
        <table class="user-table">
          <thead>
            <tr><th>user</th><th>role</th><th>status</th><th class="actions-col">actions</th></tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </section>
      <div id="admin-error" class="error"></div>
    </div>
  </div>

  <!-- COMMIT DIFF VIEWER -->
  <dialog id="diff-dialog" class="modal">
    <div class="modal-head">
      <span id="diff-title" class="modal-title">diff</span>
      <button type="button" class="modal-close ghost" data-close="diff-dialog">close</button>
    </div>
    <div id="diff-body" class="modal-body diff-body"></div>
  </dialog>

  <!-- REPO BROWSER -->
  <dialog id="files-dialog" class="modal modal-wide">
    <div class="modal-head">
      <span id="files-title" class="modal-title">files</span>
      <button type="button" class="modal-close ghost" data-close="files-dialog">close</button>
    </div>
    <div id="files-context" class="files-context" hidden></div>
    <div class="modal-body files-body">
      <div id="file-tree" class="file-tree"></div>
      <div id="file-content" class="file-content"></div>
    </div>
  </dialog>

  <!-- CONFIRM (reusable; replaces window.confirm) -->
  <dialog id="confirm-dialog" class="modal modal-confirm">
    <div class="modal-head">
      <span id="confirm-title" class="modal-title">confirm</span>
      <button type="button" class="modal-close ghost" data-close="confirm-dialog">close</button>
    </div>
    <div id="confirm-message" class="modal-body confirm-message"></div>
    <div class="modal-foot">
      <button type="button" id="confirm-cancel" class="ghost">cancel</button>
      <button type="button" id="confirm-ok" class="danger">confirm</button>
    </div>
  </dialog>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/diff.js"></script>
  <script src="/app.js"></script>
</body>
</html>
