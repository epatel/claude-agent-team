[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-lab"
version = "0.1.0"
description = "Always-on Claude Agent SDK dev lab (runs on the Raspberry Pi 5)."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2.93,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dev-lab = "dev_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
