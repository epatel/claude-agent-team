<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>the lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <!-- Relative asset paths: the console may be served under a reverse-proxy
       prefix (e.g. https://host/dev-lab/), not only at the root. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="loading">
  <!-- LOGIN -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand">◢◤ THE&nbsp;LAB</div>
      <p class="tagline">autonomous agent control room</p>
      <form id="auth-form" autocomplete="on">
        <input id="username" name="username" autocomplete="username" placeholder="username"
          title="Your account name" required />
        <input id="password" name="password" type="password" autocomplete="current-password"
          placeholder="password" title="Your account password" required />
        <input id="invite" name="invite" autocomplete="off"
          placeholder="invite code"
          title="The single-use code a super-user gave you. The very first account on a fresh lab needs no code." hidden />
        <div id="auth-error" class="error"></div>
        <div class="auth-actions">
          <button type="submit" title="Sign in with the username and password above">log in</button>
          <button type="button" id="register-btn" class="ghost"
            title="Create a new account. After the first user, registration needs an invite code.">register</button>
        </div>
      </form>
    </div>
  </main>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand-sm">◢◤ LAB</span>
        <button id="who" class="who" type="button"
          title="You're signed in. Super-users see ★ and a ⚙ admin panel."></button>
      </div>
      <button id="new-project-btn" class="new-project"
        title="Clone a git repo into the lab as a new project">+ new project</button>
      <form id="new-project-form" class="new-project-form" hidden>
        <input id="np-url" placeholder="git url" required
          title="HTTPS git URL of the repo to clone, e.g. https://github.com/owner/repo" />
        <input id="np-token" type="password" autocomplete="off"
          placeholder="github token"
          title="Needed for private repos and for pushing. Public, read-only clones don't need one." />
        <select id="np-model" class="np-model"
          title="Which Claude model this project's agent uses. You can change it per project later."></select>
        <div class="np-actions">
          <button type="submit" id="np-submit"
            title="Clone the repo at the URL above into a new project">clone</button>
          <button type="button" id="np-cancel" class="ghost"
            title="Discard this form without cloning">cancel</button>
        </div>
        <div id="np-error" class="error"></div>
      </form>
      <ul id="project-list" class="project-list"></ul>
      <div id="clients-box" class="clients-box" hidden
        title="Platform clients currently connected to the lab — machines that can run builds and tests for projects.">
        <div class="clients-head">clients</div>
        <ul id="client-list" class="client-list"></ul>
      </div>
      <button id="logout-btn" class="logout ghost"
        title="End your session and return to the login screen">log out</button>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="head-left">
          <span id="active-name" class="active-name">—</span>
          <span id="active-branch" class="branch-chip"></span>
        </div>
        <nav id="head-tabs" class="head-tabs" role="tablist" aria-label="project view" hidden>
          <button id="tab-chat" class="tab is-active" type="button" role="tab"
            data-tab="chat" aria-controls="panel-chat" aria-selected="true"
            title="Talk to this project's agent">chat</button>
          <button id="tab-repo" class="tab" type="button" role="tab"
            data-tab="repo" aria-controls="panel-repo" aria-selected="false"
            title="Repo actions: browse files, fetch/pull/push, merge, and set the base branch">repo</button>
        </nav>
        <div class="head-right">
          <label id="model-picker" class="model-picker" hidden
            title="Model for this project's agent. Switching takes effect on your next message; the conversation continues.">
            <select id="model-select" class="model-select"
              aria-label="model for this project"></select>
          </label>
          <button id="clear-chat-btn" class="clear-chat-btn ghost" type="button" hidden
            title="Clear this chat's history and start a fresh agent context. Your code and branch are not affected.">clear chat</button>
          <span id="active-status" class="status"></span>
        </div>
      </header>

      <section id="panel-chat" class="tab-panel chat-panel" role="tabpanel" aria-labelledby="tab-chat">
        <div id="transcript" class="transcript">
          <div class="empty" id="empty-state">select or clone a project to start talking</div>
        </div>
        <div id="attach-chips" class="attach-chips" hidden></div>
        <form id="chat-form" class="chat-input" hidden>
          <button type="button" id="attach-btn" class="attach-btn ghost" aria-label="attach files"
            title="Attach files for the agent to look at (saved to .lab-uploads/, never committed). Pasting an image works too.">+</button>
          <input id="attach-input" type="file" multiple hidden />
          <textarea id="chat-text" rows="1" placeholder="message the agent"
            title="⏎ to send, ⇧⏎ for a newline"></textarea>
          <button type="submit" aria-label="send" title="Send this message to the agent">↦</button>
        </form>
      </section>

      <section id="panel-repo" class="tab-panel repo-panel" role="tabpanel" aria-labelledby="tab-repo" hidden>
        <div class="repo-card">
          <label id="base-picker" class="base-picker" hidden
            title="Base branch for NEW chat threads. The current chat keeps its own branch.">
            <span class="base-label">new-chat base</span>
            <select id="base-select" class="base-select"
              aria-label="base branch for new chat threads"></select>
          </label>
          <div class="repo-actions">
            <button id="browse-btn" class="browse-files-btn" hidden
              title="Open a read-only browser of the project's working tree"><svg
                width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path
                d="M1.5 13.5v-10a1 1 0 0 1 1-1h3.6l1.6 2h6.3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-11.5a1 1 0 0 1-1-1z"/></svg>browse files</button>
            <button id="archive-btn" class="merge-btn ghost" hidden
              title="Download the working tree as a zip (git internals and venv/cache dirs excluded)">download zip</button>
            <button id="fetch-btn" class="merge-btn ghost" hidden
              title="Fetch the latest commits from the remote without changing your files">fetch</button>
            <button id="pull-btn" class="merge-btn ghost" hidden
              title="Fetch and merge the remote base branch into this checkout">pull</button>
            <button id="push-btn" class="merge-btn ghost" hidden
              title="Push this branch's commits to the remote (needs a GitHub token)">push</button>
            <button id="reset-btn" class="merge-btn ghost" hidden
              title="Discard ALL uncommitted changes in the working tree (hard reset + remove untracked files). Commits are kept.">reset</button>
            <div class="repo-actions-break" aria-hidden="true"></div>
            <button id="rebase-btn" class="merge-btn ghost" hidden
              title="Rebase this chat branch onto the base branch — replay the session's commits on top of base's latest. On conflict nothing changes and you can hand resolution to the agent in chat.">rebase on base</button>
            <button id="merge-btn" class="merge-btn ghost" hidden
              title="Merge this chat branch INTO the base branch — land your session's work. Aborts on conflict.">merge branch → base</button>
          </div>
          <form id="token-form" class="token-form" hidden
            title="This project's GitHub token, used to clone, pull and push. Stored per project.">
            <span id="token-status" class="token-status"></span>
            <input id="token-input" type="password" autocomplete="off"
              placeholder="github token" aria-label="github token"
              title="A GitHub personal access token for this project's private clone/pull/push" />
            <button id="token-save" type="submit" class="merge-btn ghost"
              title="Store this token on the project for clone, pull and push">save</button>
            <button id="token-clear" type="button" class="merge-btn ghost"
              title="Remove the stored token from this project">clear</button>
            <span id="token-error" class="error"></span>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ADMIN (super-user only) -->
  <div id="admin-overlay" class="overlay" hidden>
    <div class="admin-panel">
      <header class="admin-head">
        <span class="admin-title">⚙ user administration</span>
        <button id="admin-close" class="ghost" aria-label="close"
          title="Close the admin panel">✕</button>
      </header>

      <section class="admin-section">
        <div class="admin-section-head">
          <h3>invite codes</h3>
          <button id="new-invite-btn"
            title="Mint a single-use code so a new user can register">+ new invite</button>
        </div>
        <ul id="invite-list" class="invite-list"></ul>
      </section>

      <section class="admin-section">
        <h3>users</h3>
        <table class="user-table">
          <thead>
            <tr><th>user</th><th>role</th><th>status</th><th class="actions-col">actions</th></tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </section>
      <div id="admin-error" class="error"></div>
    </div>
  </div>

  <!-- COMMIT DIFF VIEWER -->
  <dialog id="diff-dialog" class="modal">
    <div class="modal-head">
      <span id="diff-title" class="modal-title">diff</span>
      <button type="button" class="modal-close ghost" data-close="diff-dialog">close</button>
    </div>
    <div id="diff-body" class="modal-body diff-body"></div>
  </dialog>

  <!-- REPO BROWSER -->
  <dialog id="files-dialog" class="modal modal-wide">
    <div class="modal-head">
      <span id="files-title" class="modal-title">files</span>
      <button type="button" class="modal-close ghost" data-close="files-dialog">close</button>
    </div>
    <!-- Source tabs: the lab's working tree plus any connected platform client
         holding a mirror of this project (cards/extension-clients.md). -->
    <div id="files-sources" class="files-sources" hidden></div>
    <div id="files-context" class="files-context" hidden></div>
    <div class="modal-body files-body">
      <div id="file-tree" class="file-tree"></div>
      <div id="file-content" class="file-content"></div>
    </div>
  </dialog>

  <!-- CONFIRM (reusable; replaces window.confirm) -->
  <dialog id="confirm-dialog" class="modal modal-confirm">
    <div class="modal-head">
      <span id="confirm-title" class="modal-title">confirm</span>
      <button type="button" class="modal-close ghost" data-close="confirm-dialog">close</button>
    </div>
    <div id="confirm-message" class="modal-body confirm-message"></div>
    <div class="modal-foot">
      <button type="button" id="confirm-cancel" class="ghost">cancel</button>
      <button type="button" id="confirm-ok" class="danger">confirm</button>
    </div>
  </dialog>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="diff.js"></script>
  <script src="app.js"></script>
</body>
</html>
