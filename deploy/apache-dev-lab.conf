# Reverse-proxy the dev-lab web console under the /dev-lab/ path prefix.
# Include this INSIDE the TLS VirtualHost (cookies must not travel over plain
# HTTP), e.g.:
#   sudo cp deploy/apache-dev-lab.conf /etc/apache2/conf-available/dev-lab-proxy.conf
#   # in the *:443 vhost:  Include conf-available/dev-lab-proxy.conf
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# In the *:80 vhost add a redirect instead of proxying:
#   RedirectMatch permanent ^/dev-lab(.*)$ https://home.memention.net/dev-lab$1
#
# The SPA derives its path prefix from the page URL (BASE in static/app.js), so
# no app-side configuration is needed. WebSocket endpoints are proxied with
# ws:// and must precede the catch-all http proxy; timeout=3600 keeps quiet
# agent/platform-client streams from being cut by the default proxy timeout.

RedirectMatch ^/dev-lab$ /dev-lab/
ProxyPass        /dev-lab/ws/client ws://127.0.0.1:8770/ws/client timeout=3600
ProxyPass        /dev-lab/ws        ws://127.0.0.1:8770/ws        timeout=3600
ProxyPass        /dev-lab/          http://127.0.0.1:8770/
ProxyPassReverse /dev-lab/          http://127.0.0.1:8770/
