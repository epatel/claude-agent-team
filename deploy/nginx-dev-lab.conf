# Reverse-proxy the dev-lab web console under the /dev-lab/ path prefix — the
# nginx equivalent of apache-dev-lab.conf. The SPA derives its prefix from the
# page URL, so no app-side configuration is needed.
#
# Install:
#   sudo cp deploy/nginx-dev-lab.conf /etc/nginx/snippets/dev-lab.conf
#   # in your TLS  server { listen 443 ssl; ... }  block:
#   #   include snippets/dev-lab.conf;
#   # in the plain-HTTP server block, redirect instead of proxying:
#   #   location /dev-lab { return 301 https://$host$request_uri; }
#   sudo nginx -t && sudo systemctl reload nginx
#
# The map below must live at http{} scope — most distros' nginx.conf includes
# /etc/nginx/conf.d/*.conf there; put it in its own file if your snippet is
# included only at server{} scope:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

location = /dev-lab { return 301 /dev-lab/; }

location /dev-lab/ {
    # Trailing slash on proxy_pass strips the /dev-lab/ prefix for the app.
    proxy_pass http://127.0.0.1:8770/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSockets (/dev-lab/ws console, /dev-lab/ws/client platform clients)
    # upgrade through the same location; the long read timeout keeps quiet
    # agent/client streams from being cut.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The console accepts file uploads up to 25 MB per file (repo uploads and
    # chat attachments) — nginx's 1 MB default would reject them.
    client_max_body_size 30m;
}
